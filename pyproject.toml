[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[project.optional-dependencies]
web = [
    "fastapi[standard]>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "qrcode>=8.0",
]

[tool.fastapi]
entryPoint = "web.api:app"

[tool.pytest.ini_options]
markers = [
    "web_ui: dashboard.html browser-level tests; skip if playwright not installed",
]
testpaths = ["tests"]
