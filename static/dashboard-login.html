<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 竞彩智荐</title>
<style>
  :root{
    --bg:#ffffff;--fg:#1f2328;--muted:#59636e;--border:#d0d7de;--subtle:#f6f8fa;
    --link:#0969da;--ok:#1a7f37;--bad:#cf222e;--warn-bg:#fff8c5;--warn-border:#bf8700;
    --btn-bg:#f6f8fa;--btn-hover:#eef1f4;--code-bg:#f6f8fa;color-scheme:light;
    --accent:var(--link);--error:var(--bad);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--border:#30363d;--subtle:#161b22;
      --link:#2f81f7;--ok:#3fb950;--bad:#f85149;--warn-bg:#2b2306;--warn-border:#9e6a03;
      --btn-bg:#21262d;--btn-hover:#30363d;--code-bg:#161b22;color-scheme:dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    font-size: 14px; line-height: 1.5;
    background: var(--bg); color: var(--fg);
  }
  .card {
    width: 340px; padding: 32px 28px; background: var(--subtle);
    border: 1px solid var(--border); border-radius: 6px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; color: var(--fg); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--fg); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; font-size: 14px; background: var(--bg); color: var(--fg); outline: none;
  }
  input:focus { border-color: var(--link); outline: 1px solid var(--link); outline-offset: -1px; }
  button {
    width: 100%; margin-top: 20px; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--btn-bg); color: var(--fg); font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .error { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>竞彩智荐</h1>
  <div class="sub">Dashboard · 请登录</div>
  <form id="login-form" novalidate>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">登 录</button>
    <div id="error" class="error" role="alert"></div>
  </form>
  <div class="hint">Enter 提交</div>
</div>
<script>
(function () {
  var form = document.getElementById("login-form");
  var errorEl = document.getElementById("error");
  var submitBtn = document.getElementById("submit");

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    errorEl.textContent = "";
    submitBtn.disabled = true;
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;
    fetch("/dashboard/jc/api/v1/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    }).then(function (res) {
      if (res.ok) {
        window.location.href = "/dashboard/jc/";
      } else {
        return res.json().then(function (data) {
          throw new Error(data.message || "登录失败（HTTP " + res.status + "）");
        });
      }
    }).catch(function (err) {
      errorEl.textContent = err.message || "网络错误，请重试";
      submitBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
