<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竞彩智荐 · 每日一图</title>
<style>
  body{margin:0;font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:#eef2ee;color:#1c1c1c}
  .bar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#c62828;color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .bar h1{font-size:18px;margin:0;font-weight:700}
  .bar .grow{flex:1}
  .btn{background:#fff;color:#c62828;border:0;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;color:#fff;border:1px solid #fff}
  .btn.on{background:#ffe082;color:#c62828}
  #wrap{padding:12px 18px 40px;overflow:auto}
  canvas{display:block;margin:0 auto;background:#dcebe0;box-shadow:0 2px 12px rgba(0,0,0,.25);border-radius:4px;max-width:100%;height:auto}
  @media (max-width:920px){ #wrap{padding:8px 8px 30px} .bar{padding:8px 12px} .bar h2{font-size:15px} .bar button{padding:4px 10px;font-size:13px} }
  .empty{max-width:640px;margin:60px auto;text-align:center;background:#fff;padding:48px 36px;border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,.12)}
  .empty h2{color:#c62828;margin:0 0 12px}
  .empty p{color:#666;font-size:15px;line-height:1.7}
  .footnote{text-align:center;color:#999;font-size:12px;padding:6px 0 26px}
</style>
</head>
<body>
<div class="bar">
  <h1>竞彩智荐 · 每日一图</h1>
  <span id="sub" style="font-size:13px;opacity:.9">加载中…</span>
  <div class="grow"></div>
  <button class="btn" data-sport="football">⚽ 足球</button>
  <button class="btn" data-sport="basketball">🏀 篮球</button>
  <button class="btn ghost" id="download">⬇ 下载 PNG</button>
  <button class="btn ghost" onclick="window.close()">关闭</button>
</div>
<div id="wrap">
  <div id="canvasHost"></div>
</div>
<div class="footnote">由统计模型自动生成 · 仅供信息参考 · 不构成投注建议 · 18 周岁以下禁止购彩</div>

<script>
"use strict";
/* ===== 数据获取（复用 lp_session cookie，同源）=====
 * 应用在公网 Nginx 挂 /dashboard/jc/ 前缀，本机 8077 是根路径：从前缀推导 API 基址。 */
const _idx=location.pathname.indexOf("/static/");
const _PREFIX=location.pathname.slice(0,_idx<0?0:_idx);   // "" 或 "/dashboard/jc"
const API_BASE=_PREFIX+"/api/jc/";
async function api(path){
  const r=await fetch(API_BASE+path,{credentials:"same-origin"});
  if(r.status===401){ location.href=(_PREFIX||"")+"/login"; throw new Error("未登录"); }
  if(!r.ok){ const e=await r.json().catch(()=>({message:r.statusText})); throw new Error(e.message||"请求失败"); }
  return r.json();
}
/* ===== 命中率渲染辅助 ===== */
function hitTxt(st){ const h=(st&&st.hit)||{}; if(!h.available) return h.note||"数据积累中"; return `历史 ${h.hit}/${h.n} (30天)`; }
/* 实时要闻固定 3 行：原文 \n 分隔，每行 ≤26 字，总宽 ≤78 字，超长按行截断（最后一行用 …） */
function fitNews3(t){ let lines=String(t||"今日暂无要闻").replace(/\s+/g," ").trim().split("\n"); lines=lines.slice(0,3).map(s=>s.length>26?s.slice(0,25)+"…":s); return lines.join("\n"); }
function recTxt(r){
  // 一等让球预测优先（模型在官方让球线上的让球三向：让胜/让平/让负）
  if(r.hhad_model&&r.hhad_model.pick) return r.hhad_model.pick;
  const algo=r.algo||{}, odd=r.odd||{};
  const side=(r.matched&&algo.pick)?algo.pick:(odd.pick||"");
  if(!side) return "—";
  const s=({主胜:"胜",客胜:"负",平:"平"}[side])||side;
  const hasLine=r.goal_line!=null&&r.goal_line!==""&&r.goal_line!=="0";
  return hasLine?("让"+s):s;
}
function leagueColor(lg){
  const s=String(lg||"");
  if(s.indexOf("英超")>=0||s.indexOf("英格兰超级")>=0)return "#7b1fa2";
  if(s.indexOf("西甲")>=0||s.indexOf("西班牙甲级")>=0)return "#e65100";
  if(s.indexOf("德甲")>=0||s.indexOf("德国甲级")>=0)return "#c62828";
  if(s.indexOf("意甲")>=0||s.indexOf("意大利甲级")>=0)return "#2e7d32";
  if(s.indexOf("法甲")>=0||s.indexOf("法国甲级")>=0)return "#1565c0";
  return "#757575";
}
function starsTxt(n){return "★".repeat(n>0?Math.min(n,5):0)||"—"}
function loadSvg(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url})}

/* ===== 足球每日一图 ===== */
async function drawFootball(rows,date,qr,qrurl,stats,news,pickReason){
  const canvas=document.createElement("canvas");
  canvas.id="dailyCanvas"; const ctx=canvas.getContext("2d");
  const W=900, HEAD=150, NB=78, ROW=44, FOOT=150;
  canvas.width=W;
  const matched=rows.filter(r=>r.matched);
  // 精选横条（≤2 条）+ LLM 推荐理由：高度按是否显示动态算
  const picks=rows.filter(r=>r.matched&&r.algo).sort((a,b)=>(b.algo.stars||0)-(a.algo.stars||0));
  const showPicks=picks.length?picks.slice(0,2).map(p=>`${p.match_num} ${(p.home_cn||"").slice(0,8)}vs${(p.away_cn||"").slice(0,8)}→${recTxt(p)}`):[];
  const showReason=showPicks.length && pickReason;
  const picksBlockH = (showPicks.length ? 26 : 8) + (showReason ? 22 : 0);
  // 高度：头部 + 实时要闻条(3行) + 精选横条 + 推荐理由(?) + 表格 + 页脚
  // 高度：头部 + 实时要闻条(3行) + 精选横条 + 推荐理由(?) + 表格(仅主图有赛事时) + 页脚
  const tableBlockH=rows.length?(ROW*(rows.length+1)):0; // 表头+数据行；空主图不占高度
  canvas.height=HEAD+NB+picksBlockH+tableBlockH+FOOT;
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,"#3f9d63"); g.addColorStop(0.35,"#7cc48a"); g.addColorStop(1,"#3f9d63");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,canvas.height);
  // 顶部红色横幅 + 历史命中率行
  ctx.fillStyle="#c62828"; ctx.globalAlpha=.94;
  ctx.roundRect(0,0,W,HEAD,0); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle="#fff"; ctx.textAlign="center";
  ctx.font="bold 40px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("竞彩智荐 · 每日赛事分析", W/2, 44);
  ctx.font="17px 'PingFang SC'"; ctx.fillStyle="#ffe082";
  ctx.fillText(`五大联赛在售 ${stats.on_sale||0} · 可推荐 ${stats.recommend||0} · 命中率：${hitTxt(stats)}`, W/2, 72);
  ctx.font="14px 'PingFang SC'"; ctx.fillStyle="#fff";
  ctx.fillText(`${date} · 模型多维度预测 · 不构成投注建议`, W/2, 100);
  ctx.font="13px 'PingFang SC'"; ctx.fillStyle="#fff";
  ctx.fillText("范围：NBA + 五大联赛 · 非五大联赛场次不纳入每日推荐", W/2, 124);
  let y=HEAD;
  // 实时要闻条：固定 3 行（NB=78），原文 \n 分隔行渲染
  ctx.fillStyle="#fff4d6"; ctx.fillRect(0,y,W,NB);
  ctx.fillStyle="#c62828"; ctx.font="bold 14px 'PingFang SC','Microsoft YaHei'";
  ctx.textAlign="left"; ctx.fillText("📰 实时要闻", 16, y+18);
  ctx.fillStyle="#6b5412"; ctx.font="14px 'PingFang SC'";
  const newsLines=fitNews3(news).split("\n");
  newsLines.forEach((ln,i)=>{ ctx.fillText(ln, 152, y+18+i*20); });
  y+=NB;
  // 精选横条（≤2 条）：无主图精选时整条不画（避免空框架显得排版乱）
  if (showPicks.length){
    ctx.fillStyle="#fff"; ctx.strokeStyle="#c62828";
    ctx.fillRect(0,y-10,W,30); ctx.strokeRect(0,y-10,W,30);
    ctx.fillStyle="#c62828"; ctx.font="bold 15px 'PingFang SC','Microsoft YaHei'";
    ctx.fillText("◆ 今日精选", 16, y+10);
    ctx.fillStyle="#1c1c1c"; ctx.font="14px 'PingFang SC'";
    ctx.fillText(showPicks.join("　"), 118, y+10);
    y+=26;
  } else {
    y+=8; // 留小间距，不画空横条
  }
  // LLM 推荐理由（精选 ≥1 条时显示一行）
  if (showReason){
    ctx.fillStyle="#fff"; ctx.fillRect(0,y-10,W,28);
    ctx.fillStyle="#5d4037"; ctx.font="italic 13px 'PingFang SC'";
    ctx.fillText(`💡 ${pickReason}`, 16, y+10);
    y+=22;
  }
  // 表格头：主图无赛事时整张表不画（临时赛事走独立 temp canvas，不混进主表）
  const cols=[
    {k:"league",l:"联赛",w:150},{k:"no",l:"场次",w:62},{k:"team",l:"对阵",w:238},
    {k:"handicap",l:"让球",w:56},{k:"pick",l:"推荐",w:92},{k:"score",l:"比分",w:112},{k:"haf",l:"半全场",w:190},
  ];
  const labels=["联赛","场次","对阵","让球","推荐","比分","半全场"];
  const hafCols=cols.reduce((a,c)=>a+c.w,0); // 校验不越界可用
  if(rows.length){
    trHead(ctx,y,W,cols,labels); y+=ROW;
    rows.forEach(r=>{
    const algo=r.algo||{};
    const hdcap=(r.goal_line!=null&&r.goal_line!=="")?String(r.goal_line):"—";
    const scoreTxt=(r.matched&&algo.top2&&algo.top2.length)?algo.top2.join("/"):(r.matched&&algo.score?algo.score:"—");
    const hafPick=(r.haf_model&&r.haf_model.pick)?r.haf_model.pick:"—";
    trRow(ctx,y,W,cols,[r.league_cn||"",String(r.match_num||""),`${r.home_cn||""}vs${r.away_cn||""}`,hdcap,recTxt(r),scoreTxt,hafPick],r.matched);
      y+=ROW;
    });
  } // end if(rows.length)
  // 底部红横幅（无 slogan，仅合规 + 二维码）
  ctx.fillStyle="#c62828"; ctx.globalAlpha=.94;
  ctx.fillRect(0,canvas.height-FOOT,W,FOOT); ctx.globalAlpha=1;
  ctx.fillStyle="#fff"; ctx.textAlign="left"; ctx.font="bold 20px 'PingFang SC','Microsoft YaHei'";
  ctx.fillText("长按识别二维码，查看完整分析", 30, canvas.height-FOOT+34);
  ctx.font="14px 'PingFang SC'"; ctx.fillStyle="#ffe082";
  ctx.fillText(qrurl||"", 30, canvas.height-FOOT+58);
  ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.font="bold 16px 'PingFang SC'";
  ctx.fillText("理性购彩 · 量力而行", W-30, canvas.height-FOOT+34);
  if(qr){ try{ const im=await loadSvg(qr); const qs=80, qx=W-qs-30, qy=canvas.height-FOOT+60; ctx.drawImage(im,qx,qy,qs,qs);}catch(e){} }
  return canvas;
}
/* ===== 临时赛事图块（亚运/欧冠/世界杯/奥运 等，env LEAGUE_TEMP_LEAGUES 配置）=====
 * 仅 odd 盘口层，无模型预判；视觉与主图一致以便阅读，但无 header/精选/AI 要闻。 */
function drawTempLeagues(rows,date){
  const canvas=document.createElement("canvas");
  canvas.id="tempLeaguesCanvas";
  const ctx=canvas.getContext("2d");
  const W=900, ROW=44, HEAD=60, FOOT=24;
  canvas.width=W;
  canvas.height=HEAD + ROW*rows.length + FOOT;
  // 背景：浅金色调（与主图深绿区分，提示"次级/临时"）
  ctx.fillStyle="#fff8e1"; ctx.fillRect(0,0,W,canvas.height);
  // 顶部：临时赛事横幅 + 说明
  ctx.fillStyle="#c62828"; ctx.fillRect(0,0,W,HEAD-4);
  ctx.fillStyle="#fff"; ctx.textAlign="center";
  ctx.font="bold 20px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("🏅 临时赛事（仅盘口层 · 模型暂无预测）", W/2, 26);
  ctx.font="13px 'PingFang SC'";
  ctx.fillText(`${date} · 由 LEAGUE_TEMP_LEAGUES 配置：赛事过完关闭 env 行并重启即可下线`, W/2, 46);
  // 列：联赛 / 场次 / 对阵 / 让球 / 主胜 / 平 / 客胜
  const labels=["联赛","场次","对阵","让球","主胜","平","客胜"];
  const colW=[160,60,290,60,80,80,80];
  let x=10, y=HEAD-4;
  ctx.fillStyle="#3f3f3f"; ctx.font="bold 13px 'PingFang SC'";
  labels.forEach((lab,i)=>{ ctx.fillText(lab, x, y-4); x+=colW[i]; });
  ctx.strokeStyle="#c8c8c8"; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  // 行
  ctx.font="13px 'PingFang SC','Microsoft YaHei'";
  rows.forEach((r,i)=>{
    const ry = y + ROW*i + 16;
    if(i%2===1){ ctx.fillStyle="#f5f5f5"; ctx.fillRect(0, y+ROW*i, W, ROW); ctx.fillStyle="#3f3f3f"; }
    const lg = r.league_cn || "";
    ctx.fillStyle = leagueColor(lg); ctx.fillText(lg, 10, ry);
    ctx.fillStyle="#3f3f3f";
    ctx.fillText(String(r.match_num||""), 10+colW[0], ry);
    ctx.fillText(`${r.home_cn||""} vs ${r.away_cn||""}`, 10+colW[0]+colW[1], ry);
    ctx.fillText(String(r.goal_line||"—"), 10+colW[0]+colW[1]+colW[2], ry);
    // had 盘口（主/平/客赔率）：build_rows 输出 r.had 本身是 options 字典（h/d/a 键）。
    const hadOpts = r.had || {};
    const oh = hadOpts.h, od = hadOpts.d, oa = hadOpts.a;
    ctx.fillText(oh!=null?Number(oh).toFixed(2):"—", 10+colW[0]+colW[1]+colW[2]+colW[3], ry);
    ctx.fillText(od!=null?Number(od).toFixed(2):"—", 10+colW[0]+colW[1]+colW[2]+colW[3]+colW[4], ry);
    ctx.fillText(oa!=null?Number(oa).toFixed(2):"—", 10+colW[0]+colW[1]+colW[2]+colW[3]+colW[4]+colW[5], ry);
  });
  return canvas;
}
/* ===== NBA 每日一图 ===== */
async function drawNba(rows,date,qr,qrurl,stats,news){
  const canvas=document.createElement("canvas");
  canvas.id="dailyCanvas"; const ctx=canvas.getContext("2d");
  const W=900, HEAD=120, NB=78, ROW=44, FOOT=150;
  canvas.width=W; canvas.height=HEAD+NB+ROW*rows.length+FOOT;
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,"#3f9d63"); g.addColorStop(0.35,"#7cc48a"); g.addColorStop(1,"#3f9d63");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,canvas.height);
  ctx.fillStyle="#1b5e20"; ctx.globalAlpha=.94;
  ctx.roundRect(0,0,W,HEAD,0); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle="#fff"; ctx.textAlign="center";
  ctx.font="bold 40px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("竞彩智荐 · NBA 篮球每日分析", W/2, 46);
  ctx.font="17px 'PingFang SC'"; ctx.fillStyle="#cddc39";
  ctx.fillText(`${date} · 赛事 ${stats.on_sale||0} 场 · 命中率：${hitTxt(stats)}`, W/2, 78);
  ctx.font="14px 'PingFang SC'"; ctx.fillStyle="#fff";
  ctx.fillText("让分/大小分为模型预测，仅供信息参考 · 不构成投注建议", W/2, 104);
  let y=HEAD;
  // 实时要闻条：固定 3 行
  ctx.fillStyle="#fff8e1"; ctx.fillRect(0,y,W,NB);
  ctx.fillStyle="#1b5e20"; ctx.font="bold 14px 'PingFang SC','Microsoft YaHei'";
  ctx.textAlign="left"; ctx.fillText("📰 实时要闻", 16, y+18);
  ctx.fillStyle="#6b5412"; ctx.font="14px 'PingFang SC'";
  const newsLinesNba=fitNews3(news).split("\n");
  newsLinesNba.forEach((ln,i)=>{ ctx.fillText(ln, 152, y+18+i*20); });
  y+=NB;
  const cols=[
    {k:"no",l:"编号",w:70},{k:"team",l:"对阵",w:300},{k:"spread",l:"让分预测",w:130},
    {k:"total",l:"大小分预测",w:150},{k:"margin",l:"胜分差",w:140},{k:"pick",l:"推荐",w:110},
  ];
  trHead(ctx,y,W,cols,["编号","对阵","让分预测","大小分预测","胜分差","推荐"]); y+=ROW;
  rows.forEach((r,i)=>{
    const sp=r.spread_pred!=null?`${r.spread_pred>=0?"主让":"客"}${Math.abs(r.spread_pred)}`:"—";
    const tl=r.total_pred!=null?String(r.total_pred):"—";
    const mg=r.margin!=null?(r.margin>=0?`主胜${r.margin}`:`客胜${Math.abs(r.margin)}`):"—";
    trNbaRow(ctx,y,W,cols,[String(i+1),`${r.home||""} vs ${r.away||""}`,sp,tl,mg,r.direction||"—"]);
    y+=ROW;
  });
  ctx.fillStyle="#1b5e20"; ctx.globalAlpha=.94;
  ctx.fillRect(0,canvas.height-FOOT,W,FOOT); ctx.globalAlpha=1;
  ctx.fillStyle="#fff"; ctx.textAlign="left"; ctx.font="bold 20px 'PingFang SC','Microsoft YaHei'";
  ctx.fillText("长按识别二维码，查看完整分析", 30, canvas.height-FOOT+34);
  ctx.font="14px 'PingFang SC'"; ctx.fillStyle="#cddc39";
  ctx.fillText(qrurl||"", 30, canvas.height-FOOT+58);
  ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.font="bold 16px 'PingFang SC'";
  ctx.fillText("理性购彩 · 量力而行", W-30, canvas.height-FOOT+34);
  if(qr){ try{ const im=await loadSvg(qr); const qs=80, qx=W-qs-30, qy=canvas.height-FOOT+60; ctx.drawImage(im,qx,qy,qs,qs);}catch(e){} }
  return canvas;
}
function trHead(ctx,y,W,cols,labels){
  ctx.fillStyle="#c62828"; ctx.fillRect(0,y,W,44);
  ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.font="bold 15px 'PingFang SC','Microsoft YaHei'";
  let cx=0; cols.forEach((c,i)=>{ ctx.fillText(labels[i],cx+c.w/2,y+29); cx+=c.w; });
}
function trRow(ctx,y,W,cols,cells,matched){
  ctx.fillStyle=matched?"#ffffff":"#eef4ee"; ctx.fillRect(0,y,W,44);
  let cx=0; ctx.textAlign="center";
  cols.forEach((c,i)=>{
    if(c.k==="league"){
      ctx.fillStyle=leagueColor(cells[i]); ctx.fillRect(cx,y,c.w,44);
      ctx.fillStyle="#fff"; ctx.font="bold 15px 'PingFang SC'"; ctx.fillText(cells[i],cx+c.w/2,y+29); ctx.font="15px 'PingFang SC'";
    } else if(c.k==="team"){
      ctx.textAlign="left"; ctx.fillStyle="#1c1c1c"; ctx.font="15px 'PingFang SC'";
      ctx.fillText(cells[i],cx+8,y+29); ctx.textAlign="center";
    } else if(c.k==="pick"){
      ctx.fillStyle=matched?"#c62828":"#999"; ctx.font=matched?"bold 16px 'PingFang SC'":"15px 'PingFang SC'";
      ctx.fillText(cells[i],cx+c.w/2,y+29); ctx.font="15px 'PingFang SC'";
    } else if(c.k==="score"){
      ctx.fillStyle=matched?"#1c1c1c":"#999"; ctx.font="14px 'PingFang SC'"; ctx.fillText(cells[i],cx+c.w/2,y+29);
    } else {
      ctx.fillStyle=matched?"#1c1c1c":"#999"; ctx.fillText(cells[i],cx+c.w/2,y+29);
    }
    ctx.strokeStyle="#1a5c2a33"; ctx.strokeRect(cx,y,c.w,44); cx+=c.w;
  });
}
function trNbaRow(ctx,y,W,cols,cells){
  ctx.fillStyle="#e8f5e9"; ctx.fillRect(0,y,W,44);
  let cx=0; ctx.textAlign="center";
  cols.forEach((c,i)=>{
    if(c.k==="team"){ ctx.textAlign="left"; ctx.fillStyle="#1b5e20"; ctx.font="15px 'PingFang SC'"; ctx.fillText(cells[i],cx+14,y+29); ctx.textAlign="center"; }
    else if(c.k==="pick"){ ctx.fillStyle="#1b5e20"; ctx.font="bold 15px 'PingFang SC'"; ctx.fillText(cells[i],cx+c.w/2,y+29); ctx.font="15px 'PingFang SC'"; }
    else { ctx.fillStyle="#1c1c1c"; ctx.fillText(cells[i],cx+c.w/2,y+29); }
    ctx.strokeStyle="#1a5c2a33"; ctx.strokeRect(cx,y,c.w,44); cx+=c.w;
  });
}
/* ===== 主流程 ===== */
let SPORT = new URLSearchParams(location.search).get("sport")||"football";
let CURDATE = "";
let CANVAS=null;
function setSport(s){ SPORT=s; Array.from(document.querySelectorAll('[data-sport]')).forEach(b=>b.classList.toggle("on",b.dataset.sport===s)); load(); }
/* fetch 加 timeout（300s = LLM 慢响应可接受上限），超时不阻塞出图 */
function fetchWithTimeout(path, ms, opts){
  return new Promise((resolve,reject)=>{
    const ctl=new AbortController();
    const t=setTimeout(()=>{ctl.abort();reject(new Error("timeout"));}, ms);
    fetch(API_BASE+path, Object.assign({credentials:"same-origin",signal:ctl.signal}, opts||{}))
      .then(r=>{ clearTimeout(t); resolve(r); })
      .catch(e=>{ clearTimeout(t); reject(e); });
  });
}
async function load(){
  const host=document.getElementById("canvasHost");
  document.getElementById("sub").textContent="加载中…";
  host.innerHTML="";
  try{
    // daily-image 优先（决定有无图）；daily-news 异步 300s 等，LLM 慢也无所谓
    const d = await api("daily-image?sport="+encodeURIComponent(SPORT));
    if(!d.available){ host.innerHTML='<div class="empty"><h2>还没有今天的图</h2><p>'+(d.note||"暂无在售赛事")+'</p></div>'; document.getElementById("download").style.display="none"; return; }
    let newsObj={news:"",pick_reason:""};
    try{
      const r=await fetchWithTimeout("daily-news?sport="+encodeURIComponent(SPORT), 300000);
      if(r.ok){
        const j=await r.json();
        newsObj.news=String(j.news||"");
        newsObj.pick_reason=String(j.pick_reason||"");
      }
    }catch(_){ /* timeout/LLM 失败 → 占位 */ }
    const news=newsObj.news || "今日暂无要闻";
    const pickReason=newsObj.pick_reason;
    CURDATE=d.date||"";
    document.getElementById("sub").textContent=`${d.date || ""} · ${d.sport==="basketball"?"NBA 篮球":"竞彩足球"}`;
    // QR 固定指向 Dashboard 主页（不是 dailyimage.html 自身）
    const dashboardUrl=(_PREFIX||"")+"/";
    const q=await api("qr?url="+encodeURIComponent(dashboardUrl)).catch(()=>({}));
    const mainRows = SPORT==="basketball" ? (d.rows||[]) : ((d.main_rows!=null)?d.main_rows:(d.rows||[]));
    CANVAS = SPORT==="basketball"
      ? await drawNba(mainRows,d.date,q.qr_data_url||"",dashboardUrl,d.stats||{},news)
      : await drawFootball(mainRows,d.date,q.qr_data_url||"",dashboardUrl,d.stats||{},news,pickReason);
    if(SPORT==="football" && (d.main_rows!=null) && d.main_rows.length===0 && (d.rows||[]).length && d.note){
      const noteBar=document.createElement("div");
      noteBar.style.cssText="text-align:center;color:#8d6e00;background:#fff4d6;border:1px solid #e0c96a;border-radius:6px;padding:8px 14px;font-size:13px;margin:0 auto 10px;max-width:900px;line-height:1.6";
      noteBar.textContent="ℹ️ "+d.note;
      host.insertBefore(noteBar,CANVAS);
    }
    host.appendChild(CANVAS);
    // 临时赛事（LEAGUE_TEMP_LEAGUES：亚运/欧冠/世界杯/奥运 等）：附加独立 canvas，
    // 仅显示 odd 盘口层，无模型预判；五大联赛无在售时也要展示（note 已提示主面板空）。
    const tempRows = (SPORT==="football" && d.temp_rows && d.temp_rows.length) ? d.temp_rows : [];
    if(tempRows.length){
      const tempCanvas = drawTempLeagues(tempRows, d.date);
      host.appendChild(tempCanvas);
      const tmpLabel = document.createElement("div");
      tmpLabel.style.cssText="text-align:center;color:#555;font-size:13px;padding:8px 0 6px";
      tmpLabel.textContent="🏅 临时赛事（env LEAGUE_TEMP_LEAGUES 配置） · 仅盘口层 · 模型暂无预测";
      host.insertBefore(tmpLabel, tempCanvas);
    }
    document.getElementById("download").style.display="";
  }catch(e){
    host.innerHTML='<div class="empty"><h2>生成失败</h2><p>'+(e.message||"请稍后重试")+'</p></div>';
  }
}
document.getElementById("download").addEventListener("click",()=>{
  if(!CANVAS) return;
  const a=document.createElement("a");
  a.download=`竞彩智荐_每日一图_${SPORT}_${CURDATE||new Date().toISOString().slice(0,10)}.png`;
  a.href=CANVAS.toDataURL("image/png"); a.click();
});
document.querySelectorAll('[data-sport]').forEach(b=>b.addEventListener("click",()=>setSport(b.dataset.sport)));
setSport(SPORT);
